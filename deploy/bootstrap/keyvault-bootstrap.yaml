apiVersion: v1
kind: Namespace
metadata:
  name: devsandbox-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsandbox-bootstrap
  namespace: devsandbox-system
  annotations:
    azure.workload.identity/client-id: REPLACE_BOOTSTRAP_CLIENT_ID
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devsandbox-keyvault-bootstrap
  namespace: devsandbox-system
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: devsandbox-bootstrap
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: mcr.microsoft.com/azure-cli@sha256:d41153958a61392a4c9db1591e33b533ca8ab8b59529d212d06bb6ec7e9c1f25
          command: [/bin/sh, -ec]
          env:
            - {name: AZURE_CLIENT_ID, value: "REPLACE_BOOTSTRAP_CLIENT_ID"}
            - {name: AZURE_TENANT_ID, value: "REPLACE_AZURE_TENANT_ID"}
            - {name: VAULT_NAME, value: "REPLACE_KEY_VAULT_NAME"}
          args:
            - |
              az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" --allow-no-subscriptions --only-show-errors >/dev/null
              az keyvault key download --vault-name "$VAULT_NAME" --name devsandbox-route-signing --encoding PEM --file public.pem --only-show-errors >/dev/null
              echo BOOTSTRAP_OK
              echo PUBLIC_KEY_BEGIN
              cat public.pem
              echo PUBLIC_KEY_END
