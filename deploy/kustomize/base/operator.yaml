apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsandbox-operator
  namespace: devsandbox-system
  labels:
    app.kubernetes.io/name: devsandbox-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: devsandbox-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devsandbox-operator
        app.kubernetes.io/component: operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: devsandbox-operator
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.azure.com/mode: system
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: example.invalid/devsandbox/devsandbox-operator@sha256:1111111111111111111111111111111111111111111111111111111111111111
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --workload-namespace=devsandbox-workloads
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: devsandbox-operator
  namespace: devsandbox-system
  labels:
    app.kubernetes.io/name: devsandbox-operator
spec:
  selector:
    app.kubernetes.io/name: devsandbox-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
