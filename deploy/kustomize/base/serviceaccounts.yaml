automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsandbox-broker
  namespace: devsandbox-system
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000002
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsandbox-operator
  namespace: devsandbox-system
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-router
  namespace: devsandbox-system
automountServiceAccountToken: true
