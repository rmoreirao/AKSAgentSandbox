apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsandbox-api
  namespace: devsandbox-system
  labels:
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000001
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devsandbox-web
