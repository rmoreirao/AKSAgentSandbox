apiVersion: devsandbox.io/v1alpha1
kind: DevSandboxTemplate
metadata:
  name: vscode
  labels:
    app.kubernetes.io/managed-by: devsandbox
    devsandbox.io/template-version: 0.1.0
spec:
  displayName: VS Code
  description: Standard DevSandbox environment with code-server and persistent editor state.
  version: 0.1.0
  image:
    repository: example.invalid/devsandbox/vscode
    digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  defaultProfile: medium
  entryAction: vscode
  servicePorts:
    - name: code-server
      port: 13337
      protocol: TCP
  sandboxBlueprint: {}
  capabilities:
    vscode: true
    copilot: false
    playwright: false

