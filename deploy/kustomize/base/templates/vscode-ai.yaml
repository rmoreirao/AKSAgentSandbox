apiVersion: devsandbox.io/v1alpha1
kind: DevSandboxTemplate
metadata:
  name: vscode-ai
  labels:
    app.kubernetes.io/managed-by: devsandbox
    devsandbox.io/template-version: 0.1.0
spec:
  displayName: VS Code AI
  description: Browser-based VS Code with GitHub Copilot CLI and OpenCode.
  version: 0.1.0
  image:
    repository: example.invalid/devsandbox/vscode-ai
    digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  defaultProfile: medium
  entryAction: vscode
  servicePorts:
    - name: code-server
      port: 13337
      protocol: TCP
  sandboxBlueprint: {}
  capabilities:
    vscode: true
    copilot: true
    opencode: true
    playwright: false
