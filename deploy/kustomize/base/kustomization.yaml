apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - upstream/agent-sandbox/v1.0.0/sandbox.yaml
  - crds
  - templates
  - namespaces.yaml
  - serviceaccounts.yaml
  - services.yaml
  - management.yaml
  - management-pdbs.yaml
  - api-rbac.yaml
  - broker-rbac.yaml
  - storage-class.yaml
  - operator.yaml
  - operator-rbac.yaml
  - router.yaml
  - router-rbac.yaml
  - gateway.yaml
  - networkpolicies.yaml

images:
  - name: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    newName: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    digest: sha256:bdde1a3150bd385f7318c974c1516e880b4f826b6b51a3e7f127c2f8c95b55cd

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: agent-sandbox-controller
      namespace: agent-sandbox-system
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.azure.com/mode
                      operator: In
                      values:
                        - system
