apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: devsandbox-kata-smoke
  namespace: devsandbox-workloads
  labels:
    app.kubernetes.io/name: devsandbox-kata-smoke
spec:
  podTemplate:
    spec:
      runtimeClassName: kata-vm-isolation
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: docker.io/library/busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command:
            - sh
            - -c
            - uname -r; sleep 3600
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
